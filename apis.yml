name: Anon
description: 'Anon is an enterprise AI agent platform that builds production-ready AI
  agents for companies. Its offerings include computer-use agents that automate long-running
  browser workflows, hosted web agents that perform tasks across multiple systems, and an
  agent authentication toolkit that gives developers tools to authenticate agents across
  third-party services. Originally positioned as an automated authentication layer for the
  gen-AI age, Anon has raised $14M from Forerunner Ventures, Union Square Ventures, and
  Abstract Ventures. As of this profile the company does not publish a public self-serve API,
  SDK, developer portal, or MCP server; engagements are handled directly (hello@anon.com).'
